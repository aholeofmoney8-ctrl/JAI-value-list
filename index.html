<style>
:root{color-scheme:dark;--bg:#17171b;--panel:#202026;--hover:#292930;--border:#383840;--text:#eeeef2;--muted:#a09faa;--accent:#e000d7;--field:#19191e;--row-height:44px;--font-size:14px}
body.light{color-scheme:light;--bg:#f4f4f6;--panel:#fff;--hover:#eeeef2;--border:#d9d9e0;--text:#24242a;--muted:#6d6d79;--accent:#9a22a8;--field:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--font-size)/1.5 Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:relative;background:var(--panel);border-bottom:1px solid var(--border)}
.header-inner{max-width:1100px;margin:auto;padding:22px 20px}.brand{font-size:23px;font-weight:800;letter-spacing:.7px}.brand span{color:var(--accent)}.subtitle{margin-top:3px;color:var(--muted);font-size:13px}
.settings-button{position:absolute;top:23px;right:max(20px,calc((100vw - 1100px)/2));padding:9px 13px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:5px}.settings-button:hover,.secondary-button:hover{background:var(--hover)}.settings-menu{position:absolute;z-index:50;right:max(20px,calc((100vw - 1100px)/2));top:66px;width:min(310px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow-y:auto;padding:17px;border:1px solid var(--border);border-radius:7px;background:var(--panel);box-shadow:0 10px 30px #0004}.settings-menu[hidden]{display:none}.settings-menu h2{font-size:17px;margin:0 0 15px}.setting{margin:13px 0}.setting>label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}.setting select{width:100%;min-height:36px;padding:7px 9px;border:1px solid var(--border);border-radius:5px;background:var(--field);color:var(--text)}.check-setting{display:flex;align-items:center;gap:9px;margin:14px 0}.check-setting input{accent-color:var(--accent)}.secondary-button,.primary-button{border:1px solid var(--border);padding:9px 12px;border-radius:5px;color:var(--text);background:var(--bg)}.primary-button{color:white;background:var(--accent);border-color:transparent}.menu-actions{display:flex;gap:8px;margin-top:17px}.menu-actions button{flex:1}
main{max-width:1100px;margin:25px auto 40px;padding:0 20px}.search-area{margin-bottom:24px}.search-box{display:flex;align-items:center;gap:10px;padding:0 13px;border:1px solid var(--border);border-radius:6px;background:var(--field)}.search-box:focus-within{border-color:var(--accent)}.search-icon{color:var(--muted);font-size:20px;pointer-events:none}#search{display:block;flex:1;width:100%;min-width:0;padding:14px 0;border:0;outline:0;background:transparent;color:var(--text);font-size:15px;pointer-events:auto;user-select:text}#search::placeholder{color:var(--muted)}.clear-search{display:none;border:0;color:var(--muted);background:transparent;font-size:20px}.clear-search.visible{display:block}.search-help{margin-top:7px;color:var(--muted);font-size:12px}.list-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.list-heading h1{margin:0;font-size:18px}#resultCount{color:var(--muted);font-size:12px}
.category{margin-bottom:9px;overflow:hidden;border:1px solid var(--border);border-radius:6px;background:var(--panel)}.category summary{display:flex;align-items:center;gap:10px;min-height:50px;padding:13px 15px;list-style:none;cursor:pointer;user-select:none}.category summary::-webkit-details-marker{display:none}.category summary:hover{background:var(--hover)}.arrow{width:12px;color:var(--muted);transition:transform .12s}.category[open] .arrow{transform:rotate(90deg)}.category-name{font-weight:700}.category-count{margin-left:auto;color:var(--muted);font-size:12px}.table-head,.item-row{display:grid;grid-template-columns:minmax(0,1fr) 145px 100px 190px;align-items:center;gap:12px;padding:0 15px}.table-head{min-height:35px;background:var(--bg);color:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.4px}.item-row{min-height:var(--row-height);border-bottom:1px solid var(--border)}.item-row:last-child{border-bottom:0}.item-row:hover{background:var(--hover)}.item-name{overflow-wrap:anywhere}.item-value{font-weight:700;font-variant-numeric:tabular-nums}.item-demand{color:var(--muted)}.item-status{color:var(--muted);overflow-wrap:anywhere}.empty{padding:23px 15px;color:var(--muted);text-align:center}
body.compact{--row-height:32px}body.hide-demand .demand-column,body.hide-status .status-column,body.hide-counts .category-count,body.hide-counts #resultCount,body.hide-values .item-value,body.hide-values .value-column{display:none}body.hide-values .table-head,body.hide-values .item-row{grid-template-columns:minmax(0,1fr) 100px 190px}body.hide-values.hide-status .table-head,body.hide-values.hide-status .item-row{grid-template-columns:minmax(0,1fr) 100px}body.wide main,body.wide .header-inner{max-width:1400px}body.wide .settings-button,body.wide .settings-menu{right:max(20px,calc((100vw - 1400px)/2))}body.larger-text{--font-size:16px}footer{border-top:1px solid var(--border);padding:18px 15px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:700px){.header-inner{padding:18px 14px}.brand{padding-right:112px;font-size:20px}.settings-button{top:18px;right:14px}.settings-menu{right:14px;top:62px}main{padding:0 12px;margin-top:18px}.table-head,.item-row{grid-template-columns:minmax(0,1fr) 85px 65px;gap:8px;padding-left:10px;padding-right:10px}.table-head .status-column,.item-row .status-column{display:none}.table-head,.item-row{font-size:12px}.category summary{padding:12px 10px}}
@media(max-width:390px){.table-head,.item-row{grid-template-columns:minmax(0,1fr) 75px 55px}}
</style>
</head>
<body>

<div class="menu-actions"><button id="resetSettings" class="secondary-button" type="button">Reset</button><button id="doneButton" class="primary-button" type="button">Done</button></div></section></header>
<main><div class="search-area"><div class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search items or categories..." autocomplete="off" spellcheck="false" aria-label="Search items or categories"><button id="clearSearch" class="clear-search" type="button" aria-label="Clear search">×</button></div><div class="search-help">Values are in Demon Fingers (DF). All categories start closed. Search an item or category to find it quickly.</div></div><div class="list-heading"><h1>Trading values</h1><span id="resultCount">113 items</span></div><div id="categories"></div></main>
<footer>Fan-made JJI trading value list. Values may change with the community market.</footer>

const $=id=>document.getElementById(id),searchInput=$("search"),clearSearch=$("clearSearch"),categoriesContainer=$("categories"),resultCount=$("resultCount"),settingsButton=$("settingsButton"),settingsMenu=$("settingsMenu");let searchTerm="",categoryOpenState={};
function valueOf(item){return Number(item[1])}function sorted(items){const mode=$("sortSelect").value,a=[...items];if(mode==="az")a.sort((x,y)=>x[0].localeCompare(y[0]));if(mode==="za")a.sort((x,y)=>y[0].localeCompare(x[0]));if(mode==="high")a.sort((x,y)=>valueOf(y)-valueOf(x));if(mode==="low")a.sort((x,y)=>valueOf(x)-valueOf(y));return a}
function render(){const q=searchTerm.trim().toLowerCase();categoriesContainer.replaceChildren();let total=0;for(const [cat,items] of Object.entries(valueData)){const categoryMatches=cat.toLowerCase().includes(q);let filtered=q?items.filter(it=>it.join(" ").toLowerCase().includes(q)):items;if(q&&categoryMatches)filtered=items;if(q&&!categoryMatches&&!filtered.length)continue;total+=filtered.length;const details=document.createElement("details");details.className="category";details.open=q?true:categoryOpenState[cat]===true;details.addEventListener("toggle",()=>{if(!searchTerm.trim())categoryOpenState[cat]=details.open});const summary=document.createElement("summary");summary.innerHTML=`<span class="arrow" aria-hidden="true">▶</span><span class="category-name">${cat}</span><span class="category-count">${items.length} items</span>`;details.append(summary);const head=document.createElement("div");head.className="table-head";head.innerHTML='<span>Item</span><span class="value-column">Value (DF)</span><span class="demand-column">Demand</span><span class="status-column">Status</span>';details.append(head);for(const it of sorted(filtered)){const row=document.createElement("div");row.className="item-row";const name=document.createElement("span");name.className="item-name";name.textContent=it[0];const val=document.createElement("span");val.className="item-value";val.textContent=valueOf(it).toLocaleString("en-US")+" DF";const dem=document.createElement("span");dem.className="item-demand demand-column";dem.textContent=it[2]||"—";const status=document.createElement("span");status.className="item-status status-column";status.textContent=it[3]||"—";row.append(name,val,dem,status);details.append(row)}categoriesContainer.append(details)}resultCount.textContent=`${total} items`;if(!categoriesContainer.children.length){const e=document.createElement("div");e.className="empty";e.textContent="No results found. Try another search.";categoriesContainer.append(e)}}
